name: TntClear
version: 1.1.0
main: me.tntclear.TntClear
api-version: '1.21'
description: Remove every TNT in the world, lit or not.
commands:
  tnt:
    description: Clear TNT
    usage: /tnt clear [world|loaded|lit|blocks] | /tnt explosions <on|off>
    permission: tntclear.use
permissions:
  tntclear.use:
    default: op
