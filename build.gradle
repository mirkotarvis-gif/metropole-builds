plugins { id 'java' }
group = 'me.tntclear'
version = '1.1.0'
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
jar { archiveFileName = 'TntClear-1.21.11.jar' }
